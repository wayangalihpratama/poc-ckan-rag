[DEFAULT]
debug = false

[server:main]
use = egg:gunicorn
host = 0.0.0.0
port = 5000
workers = 2
worker_class = gevent

[app:main]
use = egg:ckan
full_stack = true
# Session & Cookie Security for Local Dev (HTTP)
beaker.session.type = file
beaker.session.data_dir = /tmp/ckan/sessions
beaker.session.lock_dir = /tmp/ckan/locks
beaker.session.key = ckan
beaker.session.secret = poc-ckan-rag-beaker-session-secret-very-secure-key-999
beaker.session.httponly = true
beaker.session.samesite = Lax
beaker.session.secure = false

# Flask-Login & Session Cookie Settings
REMEMBER_COOKIE_NAME = remember_token
REMEMBER_COOKIE_SAMESITE = Lax
REMEMBER_COOKIE_SECURE = false
REMEMBER_COOKIE_HTTPONLY = true
SESSION_COOKIE_SAMESITE = Lax
SESSION_COOKIE_SECURE = false
SESSION_COOKIE_HTTPONLY = true
WTF_CSRF_ENABLED = false
WTF_CSRF_CHECK_DEFAULT = false
SECRET_KEY = poc-ckan-rag-flask-secret-key-very-secure-key-999
app_instance_uuid = 5f4e1f7d-4c3e-4f3a-8b3d-1a2b3c4d5e6f

# Database Settings
sqlalchemy.url = postgresql://ckan_default:ckan_password@db:5432/ckan_default
ckan.datastore.write_url = postgresql://ckan_default:ckan_password@db:5432/datastore_default
ckan.datastore.read_url = postgresql://datastore_default:datastore_password@db:5432/datastore_default

# Search Settings
solr_url = http://solr:8983/solr/ckan

# Redis Settings
ckan.redis.url = redis://redis:6379/1

# Site Settings
ckan.site_url = http://localhost:5000
ckan.site_id = default
ckan.site_title = CKAN RAG Knowledge Portal
ckan.site_logo = /base/images/ckan-logo.png
ckan.site_description = CKAN Knowledgebase and Document Portal
ckan.favicon = /base/images/ckan.ico

# Storage Settings
ckan.storage_path = /var/lib/ckan
ckan.max_resource_size = 50
ckan.max_image_size = 10

# Plugins
ckan.plugins = stats text_view image_view datastore akvorag

# Akvo RAG Configuration
ckanext.akvorag.base_url = https://akvo.ngrok.dev
ckanext.akvorag.app_token = tok_dGWofHTCuKOIXBapQOIU1igKF1vJmf9_g5pFDL9W-0ZchIC3YLnEYiHCUUNNJX-y
ckanext.akvorag.knowledge_base_id = 292

# API Tokens (JWT)
api_token.jwt.algorithm = HS256
api_token.jwt.encode.secret = poc-ckan-rag-jwt-encode-secret-999
api_token.jwt.decode.secret = poc-ckan-rag-jwt-encode-secret-999

# Logging configuration
[loggers]
keys = root, ckan, ckanext

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_ckan]
level = INFO
handlers = console
qualname = ckan
propagate = 0

[logger_ckanext]
level = INFO
handlers = console
qualname = ckanext
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
